name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release metadata
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;
          const expectedTag = `v${manifest.version}`;
          if (tag !== expectedTag) {
            console.error(`Tag ${tag} does not match module.json version ${manifest.version}. Expected ${expectedTag}.`);
            process.exit(1);
          }
          const expectedDownload = `https://github.com/MrMikki-boop/npc-log/releases/download/${tag}/npc-log.zip`;
          if (manifest.download !== expectedDownload) {
            console.error(`module.json download URL must be ${expectedDownload}`);
            process.exit(1);
          }
          if (manifest.manifest !== "https://github.com/MrMikki-boop/npc-log/releases/latest/download/module.json") {
            console.error("module.json manifest URL must point at the latest release module.json asset.");
            process.exit(1);
          }
          const en = JSON.parse(fs.readFileSync("languages/en.json", "utf8"));
          const ru = JSON.parse(fs.readFileSync("languages/ru.json", "utf8"));
          const missing = Object.keys(en).filter((key) => !(key in ru));
          const extra = Object.keys(ru).filter((key) => !(key in en));
          if (missing.length || extra.length) {
            console.error("Localization key mismatch", { missing, extra });
            process.exit(1);
          }
          NODE

      - name: Check JavaScript syntax
        run: |
          find scripts -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Build release archive
        run: |
          mkdir -p dist
          zip -r dist/npc-log.zip \
            module.json \
            scripts \
            styles \
            templates \
            languages \
            README.md \
            ARCHITECTURE.md \
            LICENSE
          cp module.json dist/module.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.json
            dist/npc-log.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
